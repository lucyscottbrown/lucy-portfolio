<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What Wine Are You? · Lucy Scott Brown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EEE8EE; --surface:#FBF8FA; --ink:#2A1420; --muted:#76606C;
  --line:#D9CCD4; --accent:#8E1F3D; --accent-ink:#FFFFFF; --foil:#B38E3C;
  --glass:#2A1420; --wine:#8E1F3D;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#1B1016; --surface:#271820; --ink:#F2E7EC; --muted:#B39CA8;
    --line:#45303B; --accent:#E06A88; --accent-ink:#1B1016; --foil:#D7B565; --glass:#F2E7EC;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#1B1016; --surface:#271820; --ink:#F2E7EC; --muted:#B39CA8;
  --line:#45303B; --accent:#E06A88; --accent-ink:#1B1016; --foil:#D7B565; --glass:#F2E7EC;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:32px 48px}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:28px}
header{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.glass{width:76px;height:auto}
.glass .outline{fill:none;stroke:var(--glass);stroke-width:2}
.glass .stem{fill:var(--glass)}
.glass .liquid{fill:var(--wine);transition:y .6s cubic-bezier(.3,.7,.3,1),fill .6s}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-style:italic;font-size:clamp(34px,7vw,52px);line-height:1.02;margin:4px 0 0;text-wrap:balance}

.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px clamp(20px,5vw,36px)}
.intro p{margin:0 0 20px;max-width:52ch;color:var(--muted)}
.qnum{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}
.dots{display:flex;gap:6px;align-items:center}
.dots span{width:8px;height:8px;border-radius:50%;border:1px solid var(--muted)}
.dots span.on{background:var(--accent);border-color:var(--accent)}
h2{font-family:var(--display);font-weight:600;font-size:clamp(24px,5vw,30px);line-height:1.15;margin:14px 0 22px;text-wrap:balance}
.options{display:grid;gap:10px}
.opt{font:inherit;color:var(--ink);text-align:left;background:transparent;border:1px solid var(--line);border-radius:4px;
  padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:baseline;
  transition:border-color .15s,background .15s,transform .15s}
.opt b{font-family:var(--display);font-style:italic;font-weight:600;color:var(--accent)}
.opt:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:active{transform:scale(.99)}
.back{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-top:18px;text-decoration:underline;text-underline-offset:3px}
.btn{font:inherit;font-weight:700;letter-spacing:.02em;border-radius:999px;padding:12px 24px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* The result is printed as a wine label */
.label{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px}
.label-inner{border:1.5px solid var(--foil);outline:1px solid var(--foil);outline-offset:-6px;padding:30px clamp(18px,5vw,40px);text-align:center;display:grid;gap:14px}
.label .estate{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--foil)}
.label .you{font-family:var(--body);font-size:14px;color:var(--muted);margin:0}
.label h3{font-family:var(--display);font-weight:800;font-size:clamp(36px,9vw,58px);line-height:1;margin:0;text-wrap:balance}
.label .sub{font-family:var(--display);font-style:italic;font-size:19px;margin:0;color:var(--accent)}
.rule{height:1px;background:var(--foil);width:60px;margin:2px auto;opacity:.7}
.label .blurb{max-width:46ch;margin:0 auto;text-align:left}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-block:1px solid var(--line);margin-top:6px}
.specs div{padding:10px 6px;display:grid;gap:2px}
.specs div+div{border-left:1px solid var(--line)}
.specs dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.specs dd{margin:0;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:left}
.notes h4{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:500}
.notes p{margin:0;font-size:15px}
.result-actions{justify-content:center}
.toast{font-size:14px;color:var(--muted);text-align:center;min-height:1.5em;margin:0}
@media (max-width:480px){
  .specs{grid-template-columns:repeat(2,1fr)}
  .specs div:nth-child(3){border-left:0}
  .specs div:nth-child(n+3){border-top:1px solid var(--line)}
  .notes{grid-template-columns:1fr}
  header{grid-template-columns:56px 1fr;gap:14px}
  .glass{width:56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
footer{font-size:13px;color:var(--muted);text-align:center}
</style>

<div class="wrap">
  <header>
    <svg class="glass" viewBox="0 0 120 170" aria-hidden="true">
      <defs><clipPath id="bowl"><path d="M28 12 H92 C94 58 86 86 60 92 C34 86 26 58 28 12 Z"/></clipPath></defs>
      <rect class="liquid" id="liquid" x="20" y="92" width="80" height="90" clip-path="url(#bowl)"/>
      <path class="outline" d="M28 12 H92 C94 58 86 86 60 92 C34 86 26 58 28 12 Z"/>
      <rect class="stem" x="58.5" y="92" width="3" height="58"/>
      <ellipse class="stem" cx="60" cy="152" rx="24" ry="4"/>
    </svg>
    <div>
      <div class="eyebrow">A six-question tasting</div>
      <h1>What wine are you?</h1>
    </div>
  </header>

  <main id="stage" aria-live="polite"></main>

  <footer>Just for fun. Please drink responsibly, whichever bottle you turn out to be.</footer>
</div>

<script>
const WINES = {
  champagne:{name:"Champagne",sub:"Traditional-method sparkling",grape:"Chardonnay, Pinot Noir, Meunier",region:"Champagne, France",abv:"12%",temp:"7°C",glass:"Tulip",colour:"#E7D27E",
    blurb:"You arrive and the room lifts. You're quick, bright and celebratory, but there's more structure under the bubbles than people expect: years on the lees, a lot of quiet work behind the sparkle.",
    nose:"Brioche, green apple, lemon zest",pairs:"Fried chicken, oysters, a Tuesday that needs rescuing"},
  sancerre:{name:"Sancerre",sub:"Loire Sauvignon Blanc",grape:"Sauvignon Blanc",region:"Loire Valley, France",abv:"12.5%",temp:"9°C",glass:"White",colour:"#E4E09A",
    blurb:"Crisp, precise and very good company. You say what you mean, you're funny in a dry way, and nobody ever has to wonder where they stand with you.",
    nose:"Gooseberry, cut grass, flint",pairs:"Goat's cheese, asparagus, honest feedback"},
  chenin:{name:"Chenin Blanc",sub:"Old-vine Swartland",grape:"Chenin Blanc",region:"Swartland, South Africa",abv:"13%",temp:"10°C",glass:"White",colour:"#E2C163",
    blurb:"Adaptable without being a pushover. You can go dry or sweet, still or sparkling, and you're always good. You'd rather be out in the vineyard than talking about it.",
    nose:"Quince, honey, wet stone",pairs:"Cape Malay curry, roast pork, road trips"},
  chardonnay:{name:"White Burgundy",sub:"Côte de Beaune Chardonnay",grape:"Chardonnay",region:"Burgundy, France",abv:"13%",temp:"12°C",glass:"Burgundy bowl",colour:"#D6A63A",
    blurb:"Warm, generous, quietly sophisticated. You're the friend who hosts, remembers birthdays and somehow makes everyone feel at home, and you have far more depth than you let on.",
    nose:"Hazelnut, baked lemon, butter",pairs:"Roast chicken, lobster, long dinners"},
  rose:{name:"Provence Rosé",sub:"Pale and dry",grape:"Grenache, Cinsault",region:"Côtes de Provence, France",abv:"12.5%",temp:"8°C",glass:"White",colour:"#F1A7A2",
    blurb:"Sunny, easy to be around and much more serious than the pink suggests. You set the mood, you know how to enjoy yourself, and you make it look effortless.",
    nose:"Strawberry, peach, garrigue",pairs:"Salade niçoise, grilled prawns, golden hour"},
  pinot:{name:"Pinot Noir",sub:"Central Otago",grape:"Pinot Noir",region:"Central Otago, New Zealand",abv:"13.5%",temp:"15°C",glass:"Burgundy bowl",colour:"#9C2638",
    blurb:"Sensitive, layered and a little elusive. You're hard to grow and rewarding to know. People spend years trying to work you out, and you like it that way.",
    nose:"Cherry, forest floor, rose petal",pairs:"Duck, mushrooms, a good novel"},
  barolo:{name:"Barolo",sub:"King of wines",grape:"Nebbiolo",region:"Piedmont, Italy",abv:"14.5%",temp:"17°C",glass:"Large bowl",colour:"#6B1B2B",
    blurb:"Intense, principled, built for the long haul. You can come across as a bit much at first, but give you time and you're the most rewarding person in the room.",
    nose:"Tar and roses, dried cherry, truffle",pairs:"Braised beef, aged parmesan, deep conversations"},
  orange:{name:"Orange Wine",sub:"Skin-contact white",grape:"Ribolla Gialla",region:"Friuli, Italy / Georgia",abv:"12.5%",temp:"13°C",glass:"Any, or a tumbler",colour:"#D57A2E",
    blurb:"Unconventional, curious and allergic to the obvious. You were into it before it was cool, you'll try anything once, and people either love you or don't get you yet.",
    nose:"Dried apricot, black tea, bitter orange",pairs:"Kimchi, spiced lamb, a tiny gig"}
};
const ORDER = ["champagne","sancerre","chenin","chardonnay","rose","pinot","barolo","orange"];

// Each answer gives 2 points to its first wine and 1 to its second.
const QUESTIONS = [
  {q:"It's Friday night. Where are you?",a:[
    ["Right in the middle of a packed bar",["champagne","rose"]],
    ["Hosting dinner for six, cooked from scratch",["chardonnay","barolo"]],
    ["A natural-wine bar nobody's heard of",["orange","pinot"]],
    ["Early night, so Saturday's walk starts early",["sancerre","chenin"]]]},
  {q:"How would your friends describe you?",a:[
    ["The one who turns it into a party",["champagne","rose"]],
    ["Reliable, warm, always there",["chardonnay","chenin"]],
    ["Intense. Takes a while to get to know",["barolo","pinot"]],
    ["Sharp, direct and quietly hilarious",["sancerre","orange"]]]},
  {q:"Pick a holiday.",a:[
    ["Beach club on the Côte d'Azur",["rose","champagne"]],
    ["Hiking between farm stays in the hills",["chenin","barolo"]],
    ["A city break of galleries and good restaurants",["pinot","sancerre"]],
    ["Somewhere remote, no plan at all",["orange","chenin"]]]},
  {q:"Someone pitches you a wild new idea. You…",a:[
    ["Say yes before they've finished",["champagne","orange"]],
    ["Research it properly first",["barolo","sancerre"]],
    ["Trust your gut and figure it out as you go",["chenin","rose"]],
    ["Sit with it, and come back when it feels right",["pinot","chardonnay"]]]},
  {q:"Choose a snack.",a:[
    ["Salty crisps, the good kind",["sancerre","champagne"]],
    ["A proper aged cheese board",["chardonnay","barolo"]],
    ["Anything pickled or fermented",["orange","chenin"]],
    ["A bowl of strawberries",["rose","pinot"]]]},
  {q:"Your favourite weather?",a:[
    ["A bright, crisp spring morning",["sancerre","champagne"]],
    ["A golden late-summer evening",["rose","chenin"]],
    ["Autumn drizzle and falling leaves",["pinot","chardonnay"]],
    ["A thunderstorm rolling in",["barolo","orange"]]]}
];

const stage = document.getElementById("stage");
const liquid = document.getElementById("liquid");
const root = document.documentElement;
let answers = [];

function fill(level, colour){
  // bowl spans y=12 (full) to y=92 (empty)
  liquid.setAttribute("y", 92 - 72*level);
  liquid.style.fill = colour || "";
}

function renderIntro(){
  fill(0.18);
  stage.innerHTML = `
    <section class="card intro fade">
      <p>Six quick questions about how you spend your Fridays, what you snack on and what weather you like. At the end, we'll pour your glass.</p>
      <div class="row"><button class="btn" id="start">Start tasting</button></div>
    </section>`;
  document.getElementById("start").onclick = () => { answers = []; renderQuestion(); };
}

function renderQuestion(){
  const i = answers.length;
  const Q = QUESTIONS[i];
  fill(0.18 + 0.72*(i/QUESTIONS.length));
  const dots = QUESTIONS.map((_,k)=>`<span class="${k<=i?'on':''}"></span>`).join("");
  stage.innerHTML = `
    <section class="card fade">
      <div class="qnum"><span>Question ${i+1} of ${QUESTIONS.length}</span><span class="dots" aria-hidden="true">${dots}</span></div>
      <h2>${Q.q}</h2>
      <div class="options">
        ${Q.a.map((o,k)=>`<button class="opt" id="opt-${i}-${k}" data-k="${k}"><b>${"abcd"[k]}</b><span>${o[0]}</span></button>`).join("")}
      </div>
      ${i>0?'<button class="back" id="back">Back a question</button>':''}
    </section>`;
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    answers.push(+b.dataset.k);
    answers.length===QUESTIONS.length ? renderResult() : renderQuestion();
  });
  const back = document.getElementById("back");
  if(back) back.onclick=()=>{answers.pop();renderQuestion();};
  stage.querySelector(".opt").focus({preventScroll:true});
}

function score(){
  const s = Object.fromEntries(ORDER.map(w=>[w,0]));
  answers.forEach((k,i)=>{ const [a,b]=QUESTIONS[i].a[k][1]; s[a]+=2; s[b]+=1; });
  return ORDER.slice().sort((x,y)=>s[y]-s[x] || ORDER.indexOf(x)-ORDER.indexOf(y));
}

function renderResult(){
  const ranked = score();
  const w = WINES[ranked[0]], runner = WINES[ranked[1]];
  fill(0.9, w.colour);
  const vintage = new Date().getFullYear();
  stage.innerHTML = `
    <section class="label fade">
      <div class="label-inner">
        <div class="estate">Grand Cru Personnel · Vintage ${vintage}</div>
        <p class="you">You are</p>
        <h3>${w.name}</h3>
        <p class="sub">${w.sub}</p>
        <div class="rule"></div>
        <p class="blurb">${w.blurb}</p>
        <dl class="specs">
          <div><dt>Grape</dt><dd>${w.grape.split(",")[0]}</dd></div>
          <div><dt>ABV</dt><dd>${w.abv}</dd></div>
          <div><dt>Serve at</dt><dd>${w.temp}</dd></div>
          <div><dt>Glass</dt><dd>${w.glass}</dd></div>
        </dl>
        <div class="notes">
          <div><h4>On the nose</h4><p>${w.nose}</p></div>
          <div><h4>Pairs with</h4><p>${w.pairs}</p></div>
          <div><h4>Region</h4><p>${w.region}</p></div>
          <div><h4>Close second</h4><p>${runner.name}</p></div>
        </div>
      </div>
    </section>
    <div class="row result-actions" style="margin-top:18px">
      <button class="btn" id="share">Share my result</button>
      <button class="btn ghost" id="again">Take it again</button>
    </div>
    <p class="toast" id="toast"></p>`;
  document.getElementById("again").onclick = renderIntro;
  document.getElementById("share").onclick = async () => {
    const url = "https://lucyscottbrown.com/what-wine-are-you";
    const line = `I'm ${w.name} 🍷 ${w.blurb.split(". ")[0]}. What wine are you?`;
    const text = `${line} ${url}`;
    const t = document.getElementById("toast");
    if (navigator.share) {
      try { await navigator.share({ title: "What Wine Are You?", text: line, url }); return; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    try {
      await navigator.clipboard.writeText(text);
      t.textContent = "Copied. Paste it wherever you like.";
    } catch (e) { t.textContent = text; }
  };
}

renderIntro();
</script>
